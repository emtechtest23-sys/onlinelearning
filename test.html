<!DOCTYPE html>
<html>
<head>
    <title>Digital Citizenship</title>

    <style>
        body {
            
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            
            background-image: url("images/AD.png");
  background-size: 100% auto;
  background-position: top center;
  background-repeat: repeat-y;
        }

        h1 {
            color: white;
            text-align: center;
            font-size:60px;
        }

        h2 {
            color: white;
            font-size: 50px;
        }
    
        p { 
            font-size: 35px;
        }
        .box {
  width: 100%;
  height: 1000px;

  background-image: url("images/AD.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  border: 1px solid blue;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 8px;
  box-sizing: border-box;
        }

        img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 5px;
        }

        .buttons {
            text-align:center;
            margin: 5px;
        }

        .buttons a {
            display: inline-block;
            background: linear-gradient(to right, #4facfe, #94E9F3);
            color: white;
            text-decoration: none;
            padding: 20px 20px;
            font-weight: bold;
            border-radius: 10px;
            margin: 15px;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));

        }

        .buttons a:hover {
            background-color: orange;
            color: white;
            
        }

        .content {
            display: none;
        }
    
        .content:target {
            display: block;
        }

        #all:target ~ .content {
            display: block;
        }
    </style>
</head>

</body>
</html>
